name: UMCP verification
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: umcp-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    name: MCP, browser, HTTP and WS
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Install pinned Chromium
        run: npx playwright install chromium
        timeout-minutes: 4
      - run: npm run check
      - name: Behavior tests and actual stdio client
        run: npm test
  live:
    name: Demos ${{ matrix.group }}
    needs: core
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - group: belatra-playtech-playson
            targets: belatra,playtech-gpas,playtech-ngm,playson
          - group: rubyplay-elk-global-push
            targets: rubyplay,elk,gamesglobal,push
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Install pinned Chromium
        run: npx playwright install chromium
        timeout-minutes: 4
      - name: Observe public demo with UMCP
        run: |
          live_status=0
          IFS=',' read -r -a live_targets <<< '${{ matrix.targets }}'
          for target in "${live_targets[@]}"; do
            timeout --signal=TERM --kill-after=10s 180s node scripts/live-smoke.js "$target" || live_status=1
          done
          exit "$live_status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: umcp-live-${{ matrix.group }}
          path: artifacts/live/
          retention-days: 7
