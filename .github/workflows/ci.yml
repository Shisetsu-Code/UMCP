name: UMCP verification
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: umcp-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    name: MCP, browser, HTTP and WS
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Install pinned Chromium
        run: npx playwright install chromium
        timeout-minutes: 4
      - run: npm run check
      - name: Behavior tests and actual stdio client
        run: npm test
